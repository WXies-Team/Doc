name: deploy

# push main 自动部署（增量更新）。全站内容就是 .md，paths 只能忽略 .github/**，
# 忽略 md 会把正常文档更新也挡掉；workflow_dispatch 为手动强制部署入口
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

# 同分支并发只保留最后一次（对应旧 deploy.sh 锁文件的防重入）
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 拉全量历史：VitePress 的「最后更新于」按每个文件跑
      # git log -1 取时间，默认浅克隆只剩 1 个 commit，全站时间会变成最后一次提交
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      # 构建指令沿用原 deploy.sh（VitePress outDir 配置为 ./dist）
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html 不存在，构建产物路径异常（检查 vitepress outDir）"
            exit 1
          fi

      # 构建产物直接铺到站点根目录（不带 dist/ 子目录）
      # 只同步清单内文件：清单里的新增/修改才上传，构建产物删掉的文件才从服务器删除；
      # 服务器原有数据不在清单里，永不触碰。
      # --checksum 按内容比对，绕过"每次构建 mtime 全变新"导致的全量重写，
      # 未编辑文档的 Last-Modified 保持不变；--no-times 防止 -t 把源 mtime 刷到服务器。
      # .user.ini/.well-known 为面板托管保留；git 专用文件另由上面 ssh 清理
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          DIR: ${{ secrets.SERVER_DOC_DIR }}
        run: |
          set -Eeuo pipefail
          KEY="$RUNNER_TEMP/deploy_key"
          KNOWN="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          trap 'rm -f "$KEY"' EXIT
          SSH_OPTS=(-i "$KEY" -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$KNOWN" -o BatchMode=yes)
          ssh "${SSH_OPTS[@]}" "$USER@$HOST" "mkdir -p '$DIR' && rm -rf '$DIR/.git' '$DIR/.github' '$DIR/.gitignore' '$DIR/.gitattributes' '$DIR/HANDOFF.md' '$DIR/AGENTS.md' && find '$DIR' -name .gitkeep -delete"
          DEPLOY_HOST="$USER@$HOST" DEPLOY_DEST="$DIR" DEPLOY_SSH_KEY="$KEY" \
            bash ci/deploy-managed.sh dist ci/deploy-exclude.txt -c --no-times
